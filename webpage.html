<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipoll</title>
<style>
html, body {
height: 100%;
background: #000;
margin: 0;
padding: 0;
}
</style>
</head>
<body>
<script>
(function () {
var ua = navigator.userAgent || navigator.vendor || window.opera;

var appleLink = 'https://apps.apple.com/tt/app/pipoll-invest-in-humans/id6785708425';
var androidLink = 'https://play.google.com/store/apps/details?id=com.mycompany.humanstock&hl=en';

// Mobile: iOS (iPhone/iPad/iPod, incl. iPads reporting as MacIntel with touch)
var isIOS = /iPhone|iPod|iPad/i.test(ua) ||
(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// Mobile: Android
var isAndroid = /android/i.test(ua);
// Desktop: macOS
var isMac = /Macintosh|Mac OS X/i.test(ua);

if (isIOS) {
window.location.href = appleLink;       // mobile iOS -> App Store
} else if (isAndroid) {
window.location.href = androidLink;     // mobile Android -> Play Store
} else if (isMac) {
window.location.href = appleLink;       // macOS desktop -> App Store
} else {
window.location.href = androidLink;     // anything else -> Play Store
}
})();
</script>
</body>
</html>
