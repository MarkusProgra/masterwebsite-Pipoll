<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipoll Link Stats</title>
<style>
  :root { --bg:#000; --fg:#fff; --muted:#8a8a8a; --line:#1c1c1c; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; }
  body { padding:40px 20px calc(40px + env(safe-area-inset-bottom)); }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.02em; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 28px; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th { text-align:left; color:var(--muted); font-size:12px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.06em; padding:0 12px 10px 0; }
  th.num, td.num { text-align:right; }
  td { padding:12px 12px 12px 0; border-top:1px solid var(--line); }
  td.name { font-weight:600; }
  .empty, .error { color:var(--muted); font-size:14px; padding:24px 0; }
  .error { color:#ff6b6b; }
  .row { display:flex; gap:10px; margin-top:28px; }
  input { flex:1; background:#111; border:1px solid var(--line); color:var(--fg);
    border-radius:10px; padding:10px 14px; font-size:15px; font-family:inherit; }
  input:focus { outline:none; border-color:#444; }
  button { background:var(--fg); color:#000; border:none; border-radius:10px;
    padding:10px 18px; font-size:15px; font-weight:600; font-family:inherit;
    cursor:pointer; }
  button:active { opacity:0.75; }
  .refresh { display:inline-block; margin-top:20px; color:var(--fg);
    font-size:14px; text-decoration:underline; cursor:pointer; background:none;
    border:none; padding:0; font-weight:400; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pipoll link stats</h1>
  <p class="sub">Clicks per link page (alex.html &rarr; &ldquo;alex&rdquo;)</p>
  <div id="out" class="empty">Loading&hellip;</div>
  <button class="refresh" onclick="load()">Refresh</button>
  <div class="row">
    <input id="newName" placeholder="add a link name, e.g. alex"
           onkeydown="if(event.key==='Enter')addName()" />
    <button onclick="addName()">Add</button>
  </div>
</div>

<script>
// Must match COUNTER_NS in pipoll-redirect.html.
var COUNTER_NS = 'pipoll-links-25d18bb7';
var API = 'https://abacus.jasoncameron.dev';

// Names tracked here. make-pipoll-link.sh adds new ones automatically;
// you can also add them by hand or with the box below.
var NAMES = ["manuel", "alex", ];

function allNames() {
  var extra = [];
  try { extra = JSON.parse(localStorage.getItem('pipollNames') || '[]'); }
  catch (e) {}
  var seen = {};
  return NAMES.concat(extra).filter(function (n) {
    n = String(n).toLowerCase();
    if (!n || seen[n]) return false;
    seen[n] = true;
    return true;
  });
}

function addName() {
  var el = document.getElementById('newName');
  var n = (el.value || '').toLowerCase().replace(/\.html?$/i, '')
    .replace(/[^a-z0-9_-]/g, '');
  if (!n) return;
  var extra = [];
  try { extra = JSON.parse(localStorage.getItem('pipollNames') || '[]'); }
  catch (e) {}
  if (extra.indexOf(n) === -1) extra.push(n);
  localStorage.setItem('pipollNames', JSON.stringify(extra));
  el.value = '';
  load();
}

function getCount(name, kind) {
  return fetch(API + '/get/' + COUNTER_NS + '/' + name + '-' + kind)
    .then(function (r) { return r.ok ? r.json() : { value: 0 }; })
    .then(function (d) { return d.value || 0; })
    .catch(function () { return 0; });
}

function load() {
  var out = document.getElementById('out');
  var names = allNames();
  if (!names.length) {
    out.className = 'empty';
    out.textContent = 'No link names yet — create one with make-pipoll-link.sh or add one below.';
    return;
  }
  out.className = 'empty';
  out.textContent = 'Loading…';
  Promise.all(names.map(function (n) {
    return Promise.all([getCount(n, 'views'), getCount(n, 'clicks')])
      .then(function (v) { return { name: n, views: v[0], clicks: v[1] }; });
  })).then(function (rows) {
    rows.sort(function (a, b) { return b.clicks - a.clicks; });
    var html = '<table><tr><th>Link</th><th class="num">Views</th>' +
               '<th class="num">Clicks</th></tr>';
    rows.forEach(function (r) {
      html += '<tr><td class="name">' + r.name + '</td>' +
              '<td class="num">' + r.views + '</td>' +
              '<td class="num">' + r.clicks + '</td></tr>';
    });
    html += '</table>';
    out.className = '';
    out.innerHTML = html;
  }).catch(function (e) {
    out.className = 'error';
    out.textContent = 'Could not load stats: ' + e.message;
  });
}
load();
</script>
</body>
</html>
