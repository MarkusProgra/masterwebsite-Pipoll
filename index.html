<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="apple-itunes-app" content="app-id=6785708425" />
<title>Pipoll</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8a8a;
    --accent: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .wrap { max-width: 340px; width: 100%; }
  .mark {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .status {
    margin: 0 0 28px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
  }
  .cta {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--accent);
    color: #000;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  .cta:active { opacity: 0.75; }
  .hint {
    margin: 18px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .hint.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .hint { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="mark">Pipoll</h1>
    <p class="status" id="status">Taking you to the app&hellip;</p>
    <a class="cta" id="cta" href="https://pipoll.live" rel="noopener">Open Pipoll</a>
    <p class="hint" id="hint"></p>
  </div>

<noscript>
  <p style="color:#8a8a8a;font-size:13px">
    <a style="color:#fff" href="https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB">iPhone</a> &middot;
    <a style="color:#fff" href="https://play.google.com/store/apps/details?id=com.mycompany.humanstock">Android</a> &middot;
    <a style="color:#fff" href="https://pipoll.live">Web</a>
  </p>
</noscript>

<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';

  var IOS_HTTPS   = 'https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB';
  var IOS_SCHEME  = 'itms-apps://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425';
  var PLAY_HTTPS  = 'https://play.google.com/store/apps/details?id=com.mycompany.humanstock';
  var PLAY_INTENT = 'intent://details?id=com.mycompany.humanstock#Intent;scheme=market;package=com.android.vending;end';
  var WEB         = 'https://pipoll.live';

  var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  var inAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Line\/|TikTok|Snapchat|Twitter|Pinterest|LinkedInApp/i.test(ua);

  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var cta = document.getElementById('cta');

  // Primary target: what the tappable button points at (real user gesture = most reliable).
  var primary = WEB;
  var secondary = null;
  var label = 'Open Pipoll';

  if (isIOS) {
    primary = IOS_HTTPS;
    secondary = IOS_SCHEME;
    label = 'Get Pipoll on the App Store';
  } else if (isAndroid) {
    // intent:// forces Android's in-app webview to hand off to the Play Store app.
    primary = inAppBrowser ? PLAY_INTENT : PLAY_HTTPS;
    secondary = PLAY_HTTPS;
    label = 'Get Pipoll on Google Play';
  }

  cta.href = primary;
  cta.textContent = label;

  // Track whether we actually left the page, so fallbacks don't fire after a successful hand-off.
  var gone = false;
  function markGone() { gone = true; }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) markGone();
  });
  window.addEventListener('pagehide', markGone);
  window.addEventListener('blur', markGone);

  function go(url) {
    if (gone || !url) return;
    try { window.location.replace(url); }
    catch (e) { window.location.href = url; }
  }

  function showManual() {
    if (gone) return;
    statusEl.textContent = 'Almost there.';
    cta.textContent = label;
    hintEl.textContent = inAppBrowser
      ? (isIOS
          ? 'If nothing opens, tap the \u22EF menu at the top right and choose "Open in external browser".'
          : 'If nothing opens, tap the \u22EE menu at the top right and choose "Open in Chrome".')
      : 'If nothing opens, tap the button above.';
    hintEl.className = 'hint show';
  }

  function start() {
    // 1) Synthetic click on the real anchor — in-app webviews honour anchor navigations
    //    more often than a bare location assignment.
    setTimeout(function () {
      if (gone) return;
      try { cta.click(); } catch (e) {}
    }, 120);

    // 2) Direct navigation as backup.
    setTimeout(function () { go(primary); }, 500);

    // 3) Scheme / plain-https backup (itms-apps on iOS, play https on Android).
    setTimeout(function () { go(secondary); }, 1600);

    // 4) Give up quietly and let the user tap.
    setTimeout(showManual, 2600);
  }

  // Instagram's webview kills navigations that fire before the page has finished loading.
  // Waiting for `load` (plus a paint) is the single biggest fix here.
  if (document.readyState === 'complete') {
    setTimeout(start, 60);
  } else {
    window.addEventListener('load', function () { setTimeout(start, 60); });
    // Safety net in case `load` never fires in the webview.
    setTimeout(function () { if (!gone) start(); }, 2000);
  }
})();
</script>
</body>
</html>
