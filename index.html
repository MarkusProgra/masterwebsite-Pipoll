<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="apple-itunes-app" content="app-id=6785708425" />
<title>Pipoll</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8a8a;
    --accent: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .wrap { max-width: 340px; width: 100%; }
  .mark {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .status {
    margin: 0 0 28px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
  }
  .cta {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--accent);
    color: #000;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  .cta:active { opacity: 0.75; }
  .hint {
    margin: 18px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .hint.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .hint { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="mark">Pipoll</h1>
    <p class="status" id="status">Taking you to the app&hellip;</p>
    <a class="cta" id="cta" href="https://pipoll.live" rel="noopener">Open Pipoll</a>
    <p class="hint" id="hint"></p>
  </div>

<noscript>
  <p style="color:#8a8a8a;font-size:13px">
    <a style="color:#fff" href="https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB">iPhone</a> &middot;
    <a style="color:#fff" href="https://play.google.com/store/apps/details?id=com.mycompany.humanstock">Android</a> &middot;
    <a style="color:#fff" href="https://pipoll.live">Web</a>
  </p>
</noscript>

<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';

  var IOS_HTTPS   = 'https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB';
  // Last-resort escape hatch: kicks the URL out of the webview into real Safari.
  // Only fired if the plain https navigation visibly did nothing.
  var IOS_SAFARI  = 'x-safari-https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB';
  var PLAY_HTTPS  = 'https://play.google.com/store/apps/details?id=com.mycompany.humanstock';
  // intent:// opens the Play Store app from Android webviews, falling back to
  // the https Play page if the handoff is refused.
  var PLAY_INTENT = 'intent://details?id=com.mycompany.humanstock#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
                    encodeURIComponent(PLAY_HTTPS) + ';end';
  var WEB         = 'https://pipoll.live';

  var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  var inAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Line\/|TikTok|Snapchat|Twitter|Pinterest|LinkedInApp/i.test(ua);

  var statusEl = document.getElementById('status');
  var hintEl   = document.getElementById('hint');
  var cta      = document.getElementById('cta');

  var primary = WEB;
  var label = 'Open Pipoll';

  if (isIOS) {
    primary = IOS_HTTPS;
    label = 'Get Pipoll on the App Store';
  } else if (isAndroid) {
    primary = inAppBrowser ? PLAY_INTENT : PLAY_HTTPS;
    label = 'Get Pipoll on Google Play';
  }

  cta.href = primary;
  cta.textContent = label;

  // ---- per-file click tracking ----
  // Link name is this file's own name: /alex.html -> "alex". Copies need no edits.
  var COUNTER_NS = 'pipoll-links-25d18bb7';
  var linkName = (location.pathname.split('/').pop() || '')
    .replace(/\.html?$/i, '')
    .toLowerCase()
    .replace(/[^a-z0-9_-]/g, '') || 'direct';

  function track(kind) {
    try {
      // keepalive: survives the page navigating away to the store
      fetch('https://abacus.jasoncameron.dev/hit/' + COUNTER_NS + '/' +
            linkName + '-' + kind, { keepalive: true }).catch(function () {});
    } catch (e) {}
  }

  track('views');
  cta.addEventListener('click', function () { track('clicks'); });

  // ---- did we actually leave? ----
  // Once the page is truly backgrounded we stop firing fallbacks for good.
  // Deliberately ignores `blur`, which Instagram's own overlays fire while
  // the user is still on the page.
  var gone = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { gone = true; }
  });
  window.addEventListener('pagehide', function () { gone = true; });

  // replace() instead of href: keeps this page out of history, so Back
  // returns to Instagram rather than trapping the user in a redirect loop.
  function go(url) {
    if (gone || !url) return;
    try { location.replace(url); }
    catch (e) { try { location.href = url; } catch (e2) {} }
  }

  function showManual() {
    if (gone) return;
    statusEl.textContent = 'Tap below to get the app';
    hintEl.textContent = inAppBrowser
      ? (isIOS
          ? 'If nothing opens, tap the \u22EF menu at the top right and choose "Open in external browser".'
          : 'If nothing opens, tap the \u22EE menu at the top right and choose "Open in Chrome".')
      : 'If nothing opens, tap the button above.';
    hintEl.className = 'hint show';
  }

  function start() {
    // 1. Immediate plain https navigation. This is what actually works,
    //    including inside Instagram's iOS webview.
    go(primary);

    // 2. Escape hatches, only if step 1 left us sitting here.
    if (isIOS && inAppBrowser) {
      setTimeout(function () { go(IOS_SAFARI); }, 1500);
    } else if (isAndroid && !inAppBrowser) {
      setTimeout(function () { go(PLAY_HTTPS); }, 1500);
    }

    // 3. Manual tap target.
    setTimeout(showManual, 2600);
  }

  // Script sits at the end of <body>, so the DOM is ready. Fire now rather
  // than waiting on `load` — images and the tracking fetch just add delay.
  setTimeout(start, 50);
})();
</script>
</body>
</html>
