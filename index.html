<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipoll</title>
<style>
html, body {
height: 100%;
background: #000;
margin: 0;
padding: 0;
}
</style>
</head>
<body>

<script>
(function () {
var ua = navigator.userAgent || navigator.vendor || window.opera;
var isIphone = /iPhone|iPod|iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var isAndroid = /android/i.test(ua);

if (isIphone) {
window.location.href = 'https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB';
} else if (isAndroid) {
window.location.href =
'https://play.google.com/store/apps/details?id=com.mycompany.humanstock';
} else {
window.location.href = 'https://pipoll.live';
}
})();
</script>

</body>
</html>
