<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="apple-itunes-app" content="app-id=6785708425" />
<title>Pipoll</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8a8a;
    --accent: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .wrap { max-width: 340px; width: 100%; }
  .mark {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .status {
    margin: 0 0 28px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
  }
  .cta {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--accent);
    color: #000;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  .cta:active { opacity: 0.75; }
  .hint {
    margin: 18px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .hint.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .hint { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="mark">Pipoll</h1>
    <p class="status" id="status">Taking you to the app&hellip;</p>
    <a class="cta" id="cta" href="https://pipoll.live" rel="noopener">Open Pipoll</a>
    <p class="hint" id="hint"></p>
  </div>

<noscript>
  <p style="color:#8a8a8a;font-size:13px">
    <a style="color:#fff" href="https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB">iPhone</a> &middot;
    <a style="color:#fff" href="https://play.google.com/store/apps/details?id=com.mycompany.humanstock">Android</a> &middot;
    <a style="color:#fff" href="https://pipoll.live">Web</a>
  </p>
</noscript>

<script>
(function () {
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';

  var IOS_HTTPS   = 'https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB';
  // x-safari-https:// kicks the URL out of the in-app webview into real Safari,
  // which immediately hands apps.apple.com to the App Store.
  var IOS_SAFARI  = 'x-safari-https://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425?l=en-GB';
  // itms-appss:// (double s) is the https App Store scheme — opens the store app directly.
  var IOS_SCHEME  = 'itms-appss://apps.apple.com/pa/app/pipoll-goal-investing/id6785708425';
  var PLAY_HTTPS  = 'https://play.google.com/store/apps/details?id=com.mycompany.humanstock';
  // intent:// with a browser_fallback_url: opens the Play Store app from Android
  // webviews, and falls back to the https Play page if the handoff is refused.
  var PLAY_INTENT = 'intent://details?id=com.mycompany.humanstock#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
                    encodeURIComponent(PLAY_HTTPS) + ';end';
  var WEB         = 'https://pipoll.live';

  var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  var inAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Line\/|TikTok|Snapchat|Twitter|Pinterest|LinkedInApp/i.test(ua);

  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var cta = document.getElementById('cta');

  var primary = WEB;
  var label = 'Open Pipoll';

  if (isIOS) {
    primary = IOS_HTTPS;
    label = 'Get Pipoll on the App Store';
  } else if (isAndroid) {
    primary = inAppBrowser ? PLAY_INTENT : PLAY_HTTPS;
    label = 'Get Pipoll on Google Play';
  }

  cta.href = primary;
  cta.textContent = label;

  // Track whether we actually left the page. Only trust signals that mean the
  // page was really backgrounded — NOT `blur`, which Instagram's own overlays
  // (like the "leave Instagram?" sheet) fire even when the user stays.
  var gone = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { gone = true; }
    else { gone = false; } // user came back (e.g. cancelled the leave dialog) — re-arm fallbacks
  });
  window.addEventListener('pagehide', function () { gone = true; });

  function go(url) {
    if (gone || !url) return;
    try { window.location.href = url; }
    catch (e) {}
  }

  function showManual() {
    if (gone) return;
    statusEl.textContent = 'Tap below to get the app';
    hintEl.textContent = inAppBrowser
      ? (isIOS
          ? 'If nothing opens, tap the ⋯ menu at the top right and choose "Open in external browser".'
          : 'If nothing opens, tap the ⋮ menu at the top right and choose "Open in Chrome".')
      : 'If nothing opens, tap the button above.';
    hintEl.className = 'hint show';
  }

  // ---- iOS + in-app browser (Instagram etc.) ----
  // WKWebView only allows App Store handoffs from a REAL user tap, so the
  // button is the reliable path. On tap, run an escape ladder while the
  // gesture is still fresh: Safari escape -> store scheme -> plain https.
  if (isIOS && inAppBrowser) {
    // Don't pretend an auto-redirect is coming — surface the button right away.
    statusEl.textContent = 'Tap below to get the app';

    cta.addEventListener('click', function (e) {
      e.preventDefault();
      gone = false;
      go(IOS_SAFARI);                                   // 1) escape to real Safari
      setTimeout(function () { go(IOS_SCHEME); }, 900); // 2) App Store scheme
      setTimeout(function () { go(IOS_HTTPS); }, 1900); // 3) plain https (worst case: store page in-place)
      setTimeout(showManual, 2800);                     // 4) show the escape-hatch hint
    });

    // Opportunistic auto-attempt: most Instagram versions block it (no user
    // gesture), but it's harmless — and it works in the ones that allow it.
    window.addEventListener('load', function () {
      setTimeout(function () { go(IOS_SAFARI); }, 250);
      setTimeout(showManual, 1600);
    });
    return;
  }

  // ---- everywhere else (real browsers, Android in-app) ----
  function start() {
    setTimeout(function () { go(primary); }, 120);
    if (isIOS) {
      setTimeout(function () { go(IOS_SCHEME); }, 1400);
    } else if (isAndroid) {
      setTimeout(function () { go(PLAY_HTTPS); }, 1600);
    }
    setTimeout(showManual, 2600);
  }

  if (document.readyState === 'complete') {
    setTimeout(start, 60);
  } else {
    window.addEventListener('load', function () { setTimeout(start, 60); });
    setTimeout(function () { if (!gone) start(); }, 2000);
  }
})();
</script>
</body>
</html>
